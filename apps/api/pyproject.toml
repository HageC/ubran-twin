[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "urbantwin-api"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2,<3",
  "psycopg[binary]>=3.2,<4", "alembic>=1.13,<2", "redis>=5,<7", "rq>=2,<3",
  "pydantic>=2.8,<3", "numpy>=2,<3", "scipy>=1.13,<2", "traci==1.28.0", "eclipse-sumo==1.28.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
import = ["osmium>=4,<5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
markers = ["integration: requires a local SUMO binary"]

